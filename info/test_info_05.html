<p style="font-size:17px" class="mb15">5. 제1차 시험 면제 대상자</p>
<table class="tb" cellspacing="0">
<tr><td class="td w" style="font-size:16px">전년도 1차 시험에 합격한 자</td></tr>
<tr><td class="td w" style="font-size:15px">전년도 1차 시험 면제대상자가 당해 년도 2차 시험 대상자로 접수하지 않고, 1ㆍ2차 시험대상자로 접수하면 면제포기로 처리되며, 1차 시험은 불합격 점수를 득점하고 2차 시험에는 합격점수를 득점하였더라도 2차 시험이 무효 처리됨</td></tr>
</table>
