<p class="mb15 pc">① 전체 문제 중에서 순번이 Ｘ번째인 문제로 이동하려는 경우에는 노란색 부분에 순번을 입력한 후 키보드의 "다음" 또는 "엔터"를 클릭하면 해당 문제로 이동하게 됩니다.</p>
<p class="mb15 trs">(예) 100을 입력할 경우 전체 문제 중 100번째 문제로 이동</p>
<table class="tb" cellspacing="0" style="text-align:center">
<tr><td class="td w1"><b>□</b></td>
  <td class="td bc pd bl w2" class="c99">100</td>
  <td class="td pd w2">개론</td>
  <td class="td pd bl w1">▼</td>
  <td class="td pd w2">전체</td>
  <td class="td pd bl w1">▼</td>
  <td class="td pd w3">19_07</td>
  <td class="td pd w2">순차</td>
  <td class="td pd bl w1">▼</td>
</tr>
</table>
<br>
<br>
<p class="mb15 pc">② 왼쪽부터 <span class="c99">㉠ ㉡ ㉢</span>을 순차로 클릭해 과목 선택, 회차 선택, 번호를 입력한 후 키보드의 “다음” 또는 “엔터”를 클릭하면 해당 문제로 이동하게 됩니다.</p>
<table class="tb" cellspacing="0" style="text-align:center">
